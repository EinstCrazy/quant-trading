# Research defaults. Keep machine-specific paths and credentials out of version control.
data:
  directory: data
  timezone: UTC
  price_adjustment: adjusted

backtest:
  initial_cash: 100000
  commission_bps: 5
  slippage_bps: 2
  allow_short: false

# Daily A-share collection. Run `quant-collect --help` for CLI overrides.
collection:
  provider: akshare        # akshare | baostock | sse | futu | mock
  symbols: []              # empty = use --symbols / --all / whatever is already stored
  output_directory: data/raw
  format: parquet          # parquet | csv
  adjust: qfq              # qfq | hfq | none
  lookback_days: 10        # re-fetch this trailing window to absorb adjustment changes
  schedule_at: "18:30"     # daemon trigger time, local to `timezone`
  timezone: Asia/Shanghai
  retries: 2
  pause_seconds: 0.5
  # 原样传给 provider 构造函数。futu 需要本地 OpenD 网关（先启动并登录）：
  #   provider: futu
  #   provider_options: { host: 127.0.0.1, port: 11111, markets: [SH, SZ] }
  # 注意 futu 的历史 K 线按 7 天滚动额度计费（每只代码一次），全市场历史别走它；
  # 快照行情按频率计费，适合盯候选名单。其他数据源不需要这个键。
  provider_options: {}
  report_directory: reports/collection

# Technical indicators. Run `quant-indicators --help` for CLI overrides.
indicators:
  output_directory: data/indicators
  format: parquet          # parquet | csv
  ma_periods: [5, 10, 20, 60]
  ema_periods: [12, 26]
  macd_fast: 12            # MACD: 12/26/9, histogram = 2 × (DIF − DEA)
  macd_slow: 26
  macd_signal: 9
  rsi_period: 14           # Wilder smoothing
  boll_period: 20          # band uses the population std dev (ddof=0)
  boll_std: 2.0
  kdj_period: 9            # K and D start at 50
  kdj_smooth: 3
  atr_period: 14
  williams_period: 14
  cci_period: 14
  adx_period: 14
  volatility_period: 20
  bias_period: 20          # 乖离率，相对 MA(bias_period) 的偏离百分比
  roc_period: 12           # n 日动量
  psy_period: 12           # 上涨天数占比
  mfi_period: 14           # 资金流量（需要 high/low/volume）
  volume_ratio_period: 5   # 量比的均量基准
  donchian_period: 20      # 唐奇安通道（不含当日）
  vr_period: 26            # 成交量比率

# Financial reports. Run `quant-fundamentals --help` for CLI overrides.
fundamentals:
  output_directory: data/fundamentals
  quarters: 8              # 最近 8 个已结束季度（两年）：够看趋势，不必翻十年
  pause_seconds: 0.0       # 每季度四次查询，标的多了再调大

# 监管事件（证监会立案调查）。走巨潮标题检索，一年约 10 个请求、几秒钟。
regulatory:
  output_directory: data/regulatory
  lookback_days: 365       # 回看多少天：一年，因为案子可能拖这么久
  active_days: 365         # 立案未结案的，排除多久
  manual_file: config/regulatory.yaml   # 手工登记：检索窗口外的历史悬案
  pause_seconds: 0.2       # 每页之间停一下，别把对方站点打疼
  page_size: 50
  max_pages: 40            # 翻页上限；取不全时报错而不是假装齐了
