# 手工登记的证监会立案调查名单。
#
# 为什么需要手工：自动检索回看 `regulatory.lookback_days`（默认一年）。一家更早
# 立案、至今悬而未决的公司，在窗口里是隐形的——而那恰好是最该被排除的一类。
#
# 检索到的案件会自动累积进 data/regulatory/events.parquet，不需要抄到这里；
# 这里只放「窗口之前就已经在调查中」的公司。有行政处罚决定书 / 终止调查 /
# 撤销立案的会自动解除，不需要手工删。
#
# investigations:
#   - symbol: 600000.SH      # 代码，交易所后缀可省略
#     name: 示例公司         # 可省略
#     date: 2025-06-01       # 立案公告日
#     note: 涉嫌信息披露违法违规   # 可省略
#
#   # 只有股东/高管被立案时加 issuer: false，默认按公司本体处理（硬排除）
#   - symbol: 600001.SH
#     date: 2025-06-02
#     issuer: false

investigations: []
