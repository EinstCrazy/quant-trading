# 手工登记的证监会立案调查名单。
#
# 为什么需要手工：自动扫描读的是全市场公告流，只能看到最近
# `regulatory.lookback_days` 天。一家 2024 年立案、至今悬而未决的公司，
# 在六十天的窗口里是隐形的——而那恰好是最该被排除的一类。
#
# 扫描到的案件会自动累积进 data/regulatory/events.parquet，不需要抄到这里；
# 这里只放「扫描开始之前就已经在调查中」的公司。有行政处罚决定书 / 结案 /
# 终止调查的会自动解除，不需要手工删。
#
# investigations:
#   - symbol: 600000.SH      # 代码，交易所后缀可省略
#     name: 示例公司         # 可省略
#     date: 2025-06-01       # 立案公告日
#     note: 涉嫌信息披露违法违规   # 可省略

