[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research"
version = "0.2.0"
description = "A workspace for quantitative trading research and backtesting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
collect = [
    "akshare>=1.19",
    "baostock>=0.8.8",
    "pyarrow>=14",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.scripts]
quant-collect = "quant_research.cli:main"
quant-ui = "quant_research.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quant_research.web" = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
# 渐进式接入：先只对新增的模块强制类型检查，存量模块后续补齐。
files = [
    "src/quant_research/backtest",
    "src/quant_research/portfolio",
    "src/quant_research/collector.py",
    "src/quant_research/cli.py",
    "src/quant_research/web",
    "src/quant_research/data/store.py",
    "src/quant_research/data/calendar.py",
    "src/quant_research/data/providers",
]
ignore_missing_imports = true
warn_unused_ignores = true
